services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vector-search-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vector_search
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vector_search']
      interval: 5s
      timeout: 3s
      retries: 10